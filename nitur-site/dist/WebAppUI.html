<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניטור תצפיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ניטור תצפיות — גיליון הסגנון
   עיקרון: כחול כותב, אדום מסמן. כחול = פעולה והזנה. אדום = דורש תשומת לב.
   ========================================================================== */
:root{
  color-scheme: light;
  --ink:#17252F; --ink-2:#465763; --ink-3:#6B7985;
  --paper:#F1F4F3; --sheet:#FFFFFF; --rule:#D9E0DE; --rule-2:#ECF0EF; --wash:#F6F8F7;
  --blue:#1C5CAB; --blue-mark:#2A78D6; --blue-wash:#E9F1FC; --blue-line:#BCD4F3;
  --red:#D03B3B; --red-wash:#FBEAEA; --orange:#EC835A; --orange-wash:#FDF0EA;
  --yellow:#FAB219; --yellow-wash:#FEF5DC; --green:#0CA30C; --green-wash:#E6F6E6;
  --lime:#8CCB5E;
  --margin:#E7A7A7;
  --rail:#17252F; --rail-ink:#C9D5DC;
  --sans:'IBM Plex Sans Hebrew','Segoe UI',Arial,sans-serif;
  --serif:'Frank Ruhl Libre','David Libre',David,'Times New Roman',serif;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue-mark);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- שלד ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.rail{display:none}
.topbar{position:sticky;top:0;z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:54px}
.topbar .brand{font-family:var(--serif);font-weight:700;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .me{font-size:12px;color:var(--ink-2);text-align:end;line-height:1.25;max-width:46%}
.topbar .me b{display:block;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;padding:16px 16px 96px;width:100%;max-width:1200px;margin:0 auto}
.busy{position:fixed;top:0;inset-inline:0;height:3px;z-index:90;background:transparent;overflow:hidden;pointer-events:none}
.busy.on::after{content:'';position:absolute;inset-block:0;width:40%;background:var(--blue-mark);animation:busy 1.1s linear infinite}
@keyframes busy{from{inset-inline-start:-40%}to{inset-inline-start:100%}}

.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--sheet);border-top:1px solid var(--rule);
  display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:500;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--blue)}
.tabbar button.on::before{content:'';position:absolute;top:-1px;inset-inline:22%;height:2px;background:var(--blue)}
.tabbar .plus{flex:0 0 auto;width:64px}
.tabbar .plus span.c{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:3px solid var(--sheet)}
.tabbar .plus span.c svg{width:24px;height:24px}
.tabbar .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:16px;padding:0 4px}

@media(min-width:960px){
  .app{flex-direction:row}
  .tabbar,.topbar{display:none}
  .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;width:212px;flex:0 0 212px;
    background:var(--rail);color:var(--rail-ink);padding:22px 0 14px}
  .rail .brand{font-family:var(--serif);font-weight:700;font-size:22px;color:#fff;padding:0 22px 2px;line-height:1.2}
  .rail .sub{font-size:12px;padding:0 22px 20px;color:#8FA2AE}
  .rail nav{flex:1;display:flex;flex-direction:column;gap:1px}
  .rail nav button{border:0;background:none;color:inherit;text-align:start;padding:9px 22px;font-size:15px;font-weight:500;
    display:flex;align-items:center;gap:11px;position:relative}
  .rail nav button svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
  .rail nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .rail nav button.on{color:#fff;background:rgba(255,255,255,.09)}
  .rail nav button.on::before{content:'';position:absolute;inset-block:6px;inset-inline-start:0;width:3px;background:#6FA8F0}
  .rail nav .gap{height:14px}
  .rail nav .new{margin:4px 16px 12px;padding:10px 12px;border-radius:var(--r);background:var(--blue-mark);color:#fff;justify-content:center;font-weight:600}
  .rail nav .new:hover{background:#3987E5}
  .rail nav .n{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
  .rail .me{padding:12px 22px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;line-height:1.35}
  .rail .me b{display:block;color:#fff;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
  .rail .me button{border:0;background:none;color:#8FB8EE;padding:6px 0 0;font-size:12px}
  .main{padding:28px 32px 48px;margin:0;max-width:1240px}
}

/* ---------- כותרת עמוד ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.2px}
.ph .ph-t{flex:1 1 260px;min-width:0}
.ph .lead{color:var(--ink-2);font-size:14px;max-width:70ch;margin-top:4px}
.ph .sp{flex:1}
@media(min-width:960px){.ph h1{font-size:32px}}
.back{border:0;background:none;color:var(--blue);padding:0;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
.back svg{width:16px;height:16px}

/* ---------- משטחים ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:16px}
.sheet>.hd{display:flex;align-items:baseline;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.sheet>.hd h2{font-size:16px;font-weight:600}
.sheet>.hd .note{color:var(--ink-3);font-size:13px}
.sheet>.hd .sp{flex:1}
.sheet>.bd{padding:14px 16px 16px}
.sheet>.bd.flush{padding:8px 0 4px}
.cols{display:grid;gap:16px}
@media(min-width:900px){.cols.c2{grid-template-columns:1fr 1fr}.cols.c21{grid-template-columns:1.6fr 1fr}}
.cols>.sheet{margin-bottom:0}
.cols{margin-bottom:16px}

/* רצועת מדדים: שורה אחת מחולקת בקווים, לא כרטיסים */
.ledger{display:grid;grid-template-columns:repeat(2,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.ledger .cell{padding:13px 16px 12px;border-inline-start:1px solid var(--rule-2);border-top:1px solid var(--rule-2);min-width:0}
.ledger .cell:nth-child(2n+1){border-inline-start:0}
.ledger .cell:nth-child(-n+2){border-top:0}
.ledger .cell:last-child:nth-child(odd){grid-column:1/-1}
.ledger .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.ledger .v{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.5px;margin-top:2px}
.ledger .v small{font-size:15px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.ledger .f{font-size:12px;color:var(--ink-3);margin-top:1px}
.ledger .f.bad{color:var(--red);font-weight:600}
.ledger .f.good{color:#0A7A0A;font-weight:600}
.ledger button.cell{border-width:0;border-inline-start:1px solid var(--rule-2);border-top:1px solid var(--rule-2);background:none;text-align:start}
.ledger button.cell:hover{background:var(--wash)}
@media(min-width:700px){
  .ledger .cell:last-child:nth-child(odd){grid-column:auto}
  .ledger{grid-template-columns:repeat(var(--n,4),1fr)}
  .ledger .cell,.ledger button.cell{border-top:0;border-inline-start:1px solid var(--rule-2)}
  .ledger .cell:first-child{border-inline-start:0}
}

/* ---------- כפתורים ושדות ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 16px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--sheet);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#184F95}
.btn.danger{color:var(--red);border-color:#EDC4C4}
.btn.danger:hover{background:var(--red-wash)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-wash)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.fld{margin-bottom:14px;min-width:0}
.fld>label,.fld>.lb{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fld .opt{font-weight:400;color:var(--ink-3)}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
textarea.in{min-height:84px;resize:vertical;line-height:1.5}
.in:focus{outline:0;border-color:var(--blue-mark);box-shadow:0 0 0 3px var(--blue-wash)}
.in.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-wash)}
.in::placeholder{color:#9AA6AF}
button.in{text-align:start;display:flex;align-items:center;gap:8px}
button.in .ph-t{color:#9AA6AF}
button.in .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.in svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 16px}
.g2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.seg button{flex:1;border:0;border-inline-start:1px solid var(--rule);background:none;min-height:40px;padding:6px 10px;font-weight:500;font-size:14px}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.seg.sm button{min-height:34px;font-size:13px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .in{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.bar .grow{flex:1 1 200px;min-width:160px}
.bar .cnt{color:var(--ink-3);font-size:13px;margin-inline-start:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px 10px;font-weight:500;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabs button .n{font-size:11px;font-weight:700;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;margin-inline-start:5px;line-height:16px;display:inline-block}

/* ---------- תגיות וציונים ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chip.red{background:var(--red-wash);color:#8E1F1F}.chip.red::before{background:var(--red)}
.chip.orange{background:var(--orange-wash);color:#8A3B18}.chip.orange::before{background:var(--orange)}
.chip.yellow{background:var(--yellow-wash);color:#6B4B00}.chip.yellow::before{background:var(--yellow)}
.chip.green{background:var(--green-wash);color:#0B5F0B}.chip.green::before{background:var(--green)}
.chip.blue{background:var(--blue-wash);color:var(--blue)}.chip.blue::before{background:var(--blue-mark)}
.chip.plain::before{display:none}
.sc{display:inline-block;min-width:42px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:4px;background:var(--rule-2);color:var(--ink);font-size:14px}
.sc.low{background:var(--red-wash);color:#8E1F1F;box-shadow:inset 3px 0 0 var(--red)}
.sc.high{background:var(--green-wash);color:#0B5F0B}
.sc.none{background:none;color:var(--ink-3);font-weight:400}
.sc.big{font-size:28px;padding:4px 14px;min-width:76px;border-radius:var(--r)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--rule)}
.r1{background:var(--red)!important}.r2{background:var(--orange)!important}.r3{background:var(--yellow)!important}
.r4{background:var(--lime)!important}.r5{background:var(--green)!important}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:13px}

/* ---------- רשימות ---------- */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 16px;border-top:1px solid var(--rule-2);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
button.li:hover{background:var(--wash)}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{grid-column:1/-1;color:var(--ink-2);font-size:13px;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.li .e{display:flex;align-items:center;gap:8px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px;font-weight:600}
.empty .btn{margin-top:14px}
.more{display:flex;justify-content:center;padding:12px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:start;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet);position:sticky;top:0}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--ink)}
table.t th .ar{font-size:10px;margin-inline-start:3px;color:var(--blue)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:center;font-variant-numeric:tabular-nums}
table.t td.w{white-space:normal;min-width:240px;color:var(--ink-2);font-size:13px;line-height:1.45}
table.t tbody tr.tap{cursor:pointer}
table.t tbody tr.tap:hover{background:var(--wash)}
table.t td:first-child,table.t th:first-child{padding-inline-start:16px}
table.t td:last-child,table.t th:last-child{padding-inline-end:16px}
table.t td b{font-weight:600}
table.t tfoot td{border-top:1px solid var(--rule);font-weight:600;background:var(--wash)}
td .cr{display:inline-block;min-width:34px;padding:1px 5px;border-radius:3px;text-align:center}
.wk{display:inline-flex;gap:2px;direction:ltr}
.wk i{font-style:normal;width:17px;height:20px;border-radius:2px;font-size:10.5px;line-height:20px;text-align:center;background:var(--rule-2);color:var(--ink-3);font-variant-numeric:tabular-nums}
.wk i.p{background:var(--yellow-wash);color:#6B4B00;font-weight:600}
.wk i.f{background:var(--green-wash);color:#0B5F0B;font-weight:700}

/* ---------- פירוט ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media(min-width:700px){.kv.two{grid-template-columns:auto 1fr auto 1fr}}
.name{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.15}
.crit-row{padding:12px 0;border-top:1px solid var(--rule-2)}
.crit-row:first-child{border-top:0;padding-top:2px}
.crit-row .top{display:flex;align-items:center;gap:10px}
.crit-row .top b{font-weight:600;flex:1}
.crit-row .val{font-weight:700;font-size:17px;min-width:22px;text-align:center}
.crit-row .tx{color:var(--ink-2);font-size:14px;margin-top:4px;white-space:pre-wrap;max-width:75ch}
.txt{white-space:pre-wrap;max-width:75ch}
.txt-b{padding:12px 0;border-top:1px solid var(--rule-2)}
.txt-b:first-child{border-top:0;padding-top:0}
.txt-b h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--blue-wash);border:1px solid var(--blue-line);margin-bottom:16px;font-size:14px}
.callout.warn{background:var(--yellow-wash);border-color:#F1DDA0}
.callout.bad{background:var(--red-wash);border-color:#EDC4C4}
.callout.ok{background:var(--green-wash);border-color:#BFE3BF}
.callout .x{flex:1;min-width:0}
.callout .row-btns{margin-top:8px}
.reasons{margin:6px 0 0;padding-inline-start:18px;color:var(--ink-2);font-size:14px}
.reasons li{margin-bottom:2px}

/* ---------- טופס התצפית: דף מחברת ---------- */
.form{max-width:860px}
.form .sheet{position:relative;padding-inline-start:44px}
.form .sheet::before{content:'';position:absolute;inset-block:0;inset-inline-start:33px;width:1px;background:var(--margin)}
.form .step{position:absolute;inset-inline-start:0;top:13px;width:33px;text-align:center;font-family:var(--serif);font-weight:700;font-size:18px;color:#B86A6A}
.form .sheet>.hd{padding-inline-start:12px}.form .sheet>.bd{padding-inline-start:12px}
@media(min-width:700px){
  .form .sheet{padding-inline-start:64px}.form .sheet::before{inset-inline-start:52px}
  .form .step{width:52px;font-size:22px;top:11px}
}
.auto{border:1px solid var(--blue-line);background:var(--blue-wash);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.auto .h{font-weight:600;color:var(--blue);margin-bottom:5px;font-size:12.5px}
.auto .g{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 14px}
@media(min-width:640px){.auto .g{grid-template-columns:repeat(3,1fr)}}
.auto .g span{color:var(--ink-2)}.auto .g b{font-weight:600}
.auto.warn{background:var(--yellow-wash);border-color:#F1DDA0}.auto.warn .h{color:#6B4B00}
.rub{padding:14px 0;border-top:1px solid var(--rule-2)}
.rub:first-child{border-top:0;padding-top:0}
.rub .q{font-weight:600;line-height:1.4}
.rub .w{font-size:12.5px;color:var(--ink-3);margin:1px 0 9px}
.rate{display:flex;gap:6px;align-items:stretch}
.rate button{flex:1;min-height:48px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-weight:700;font-size:18px;color:var(--ink-2);max-width:74px}
.rate button:hover{border-color:var(--ink-3)}
.rate button.on{border-color:transparent;color:var(--ink)}
.rate button.on.r1{color:#fff}
.rate button.na{font-size:12.5px;font-weight:600;max-width:none;flex:0 0 auto;padding:0 10px;color:var(--ink-3)}
.rate button.na.on{background:var(--ink-2)!important;color:#fff}
.rate-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:4px;max-width:394px}
.rub .more-d{margin-top:8px}
.rub .more-d button{border:0;background:none;color:var(--blue);padding:2px 0;font-size:13.5px;font-weight:500}
.rub textarea{margin-top:6px;min-height:64px}
.rub.miss .q{color:var(--red)}
.savebar{position:sticky;bottom:60px;z-index:20;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(23,37,47,.12)}
.savebar .s{flex:1;min-width:0;line-height:1.25}
.savebar .s b{font-size:22px;font-weight:700}
.savebar .s span{display:block;font-size:12px;color:var(--ink-3)}
@media(min-width:960px){.savebar{bottom:16px}}

/* ---------- תרשימים ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart .lab{fill:var(--ink-2)}
.chart .val{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--rule-2);stroke-width:1}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .ln{fill:none;stroke:var(--blue-mark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--blue-mark);opacity:.1}
.chart .pt{fill:var(--blue-mark);stroke:var(--sheet);stroke-width:2}
.chart .col{fill:var(--blue-mark)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:focus{outline:none}
.chart .hit:hover+.mk,.chart .hit:focus+.mk{opacity:.75}
.chart .thr{stroke:var(--red);stroke-width:1;opacity:.55}
.chart .thr-t{fill:#8E1F1F;font-size:11px}
.chart .ref{stroke:var(--ink);stroke-width:2}
.minis{display:grid;grid-template-columns:1fr;gap:6px 20px}
@media(min-width:700px){.minis{grid-template-columns:repeat(3,1fr)}}
.minis h3{font-size:13.5px;font-weight:600;margin-bottom:2px}
.minis .muted{font-size:12.5px}
.hb{display:grid;grid-template-columns:minmax(92px,auto) 1fr 44px;gap:7px 10px;align-items:center;font-size:13.5px}
.hb .l{color:var(--ink-2);min-width:0}
.hb .tr{height:14px;position:relative;background:var(--rule-2);border-radius:0 4px 4px 0}

.hb .fl{position:absolute;inset-block:0;inset-inline-start:0;background:var(--blue-mark);border-radius:0 4px 4px 0;max-width:100%}
[dir=rtl] .hb .fl{border-radius:4px 0 0 4px}
.hb .rf{position:absolute;inset-block:-3px;width:2px;background:var(--ink)}
.hb .v{font-weight:600;text-align:end;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--blue-mark);vertical-align:-1px;margin-inline-end:5px}
.legend i.rf{width:2px;height:14px;background:var(--ink);border-radius:0}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:#fff;border-radius:5px;padding:6px 9px;font-size:12.5px;line-height:1.4;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip b{font-weight:700;font-size:14px}
.tip span{display:block;color:#C3CFD7}

/* ---------- שכבות ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(23,37,47,.45);display:flex;align-items:flex-end;justify-content:center}

@media(min-width:700px){.ov{align-items:center}.dlg{border-radius:10px;max-height:80vh}}

.dlg .dh h2{font-size:17px;font-weight:600;flex:1}
.dlg .dh button{border:0;background:none;padding:6px;color:var(--ink-2);display:flex}
.dlg .dh button svg{width:20px;height:20px}
.dlg .db{padding:14px 16px;overflow-y:auto;flex:1}
.dlg .df{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule-2);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.dlg .search{padding:10px 16px;border-bottom:1px solid var(--rule-2)}
.dlg .opts{overflow-y:auto;flex:1;min-height:120px}
.dlg .opt{display:block;width:100%;border:0;border-top:1px solid var(--rule-2);background:none;text-align:start;padding:11px 16px;line-height:1.3}
.dlg .opt:first-child{border-top:0}
.dlg .opt:hover,.dlg .opt.cur{background:var(--blue-wash)}
.dlg .opt b{font-weight:600;display:block}
.dlg .opt span{font-size:12.5px;color:var(--ink-2)}
.dlg .opt.add b{color:var(--blue)}
.dlg .grp{padding:6px 16px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--wash);border-top:1px solid var(--rule-2)}
.toasts{position:fixed;bottom:76px;inset-inline:0;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(min-width:960px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:500;max-width:480px;box-shadow:0 6px 20px rgba(0,0,0,.22);pointer-events:auto}
.toast.err{background:#9E2A2A}
.gate{max-width:460px;margin:12vh auto 0;padding:0 20px;text-align:center}
.gate h1{font-family:var(--serif);font-size:30px;margin-bottom:10px}
.gate p{color:var(--ink-2);margin-bottom:8px}
.spin{padding:48px 16px;text-align:center;color:var(--ink-3)}

/* ---------- הדפסה ---------- */
.print-only{display:none}
@media print{
  body{background:#fff;font-size:12.5px}
  .rail,.tabbar,.topbar,.busy,.toasts,.no-print,.back,.savebar{display:none!important}
  .main{padding:0;max-width:none}
  .sheet{border:0;border-top:1px solid #999;border-radius:0;break-inside:avoid;margin-bottom:8px}
  .sheet>.hd{padding:8px 0 0}.sheet>.bd{padding:8px 0}
  .print-only{display:block}
  .ledger{border-color:#999}
  a{color:inherit}
}

(function () {

/* ---------- הורדת CSV ---------- */
function downloadCsv(name, rows) {
  var txt = rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c === null || c === undefined ? '' : c);
      if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s;      // לא נוסחה באקסל
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  try {
    var blob = new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 500);

/* ==========================================================================
   חישובים: כל הדוחות נגזרים כאן מרשימת התצפיות, בדפדפן.
   הכללים זהים לאלה של גיליונות הניתוח בקובץ.
   ========================================================================== */
function r1(x) { return Math.round(x * 10) / 10; }
function trimNum(x) { return String(Math.round(x * 100) / 100); }

function semOf(iso) {
  if (!iso) return '';
  var d = toD(iso), S = D.cfg.semesters || [];
  for (var i = 0; i < S.length; i++) {
    var a = new Date(S[i][1][0], S[i][1][1], S[i][1][2]);
    var b = new Date(S[i][2][0], S[i][2][1], S[i][2][2], 23, 59, 59);
    if (d >= a && d <= b) return S[i][0];
  }
  return '';
}
function curSem() {
  var S = D.cfg.semesters || [];
  return semOf(D.today) || (S.length ? S[S.length - 1][0] : '');
}
function schoolWeek(iso) {
  var ss = D.cfg.schoolStart;
  if (!iso || !ss) return 0;
  var start = new Date(ss[0], ss[1], ss[2]), x = toD(iso);
  if (x < start) return 0;
  return Math.floor((x - start) / (7 * 86400000)) + 1;
}
function weekStart(n) {
  var ss = D.cfg.schoolStart, d = new Date(ss[0], ss[1], ss[2]);
  d.setDate(d.getDate() + (n - 1) * 7);
  return isoOf(d);
}

function agg(list) {
  var n6 = D.cfg.criteria.length;
  var a = { n: 0, cnt: 0, sum: 0, low: 0, crit: [], critN: [], seen: {}, last: '', fb: 0 };
  for (var i = 0; i < n6; i++) { a.crit.push(0); a.critN.push(0); }
  list.forEach(function (o) {
    a.n++;
    if (o.m) a.seen[o.m] = 1;
    if (o.s !== null && o.s !== undefined) { a.cnt++; a.sum += o.s; if (o.s < D.cfg.low) a.low++; }
    (o.c || []).forEach(function (v, i) { if (typeof v === 'number') { a.crit[i] += v; a.critN[i]++; } });
    if (o.d && o.d > a.last) a.last = o.d;
    if (o.fb === 'כן') a.fb++;
  });
  a.avg = a.cnt ? a.sum / a.cnt : null;
  a.mash = Object.keys(a.seen).length;
  a.ca = a.crit.map(function (s, i) { return a.critN[i] ? s / a.critN[i] : null; });
  return a;
}

function isMadmach(o) { return (D.cfg.madmach || []).indexOf(o.sh) !== -1; }
function isMine(o) { return (o.by && o.by === D.user.email) || same(o.ob, D.user.name); }

/* ---------- מש"קית אחת ---------- */
function mashStats(name) {
  var cfg = D.cfg, list = X.byMash[name] || [];
  var a = agg(list);
  var st = { n: name, total: list.length, list: list, avg: a.avg, ca: a.ca };
  var last = list.length ? list[list.length - 1] : null;
  st.last = last;
  st.lastScore = last ? last.s : null;
  st.firstScore = list.length ? list[0].s : null;
  st.semN = list.filter(function (o) { return semOf(o.d) === X.sem; }).length;
  st.age = last ? last.age : null;
  st.diff = (list.length >= 2 && st.lastScore !== null && st.firstScore !== null)
    ? r1(st.lastScore - st.firstScore) : null;

  /* סיכון — כמו "מש"קיות שדורשות טיפול" */
  var reasons = [], level = 0;
  if (last) {
    if (st.lastScore !== null && st.lastScore < cfg.low) {
      reasons.push('הציון האחרון ' + f1(st.lastScore) + ', מתחת לסף ' + cfg.low); level += 2;
    }
    if (st.diff !== null && st.diff <= -cfg.riskDrop) {
      reasons.push('ירידה של ' + Math.abs(st.diff) + ' נקודות מהתצפית הראשונה (' + f1(st.firstScore) + ' ← ' + f1(st.lastScore) + ')'); level += 2;
    }
    var weak = [];
    (last.c || []).forEach(function (v, i) { if (typeof v === 'number' && v <= 2) weak.push(cfg.criteria[i].label + ' (' + v + ')'); });
    if (weak.length >= cfg.riskWeak) { reasons.push('חולשה ב-' + weak.length + ' קריטריונים: ' + weak.join(', ')); level += 2; }
    else if (weak.length === 1) { reasons.push('קריטריון חלש בודד: ' + weak[0]); level += 1; }
    if (list.length >= 2) {
      var prev = list[list.length - 2].s;
      if (st.lastScore !== null && prev !== null && st.lastScore < cfg.low && prev < cfg.low) {
        reasons.push('שתי תצפיות רצופות מתחת לסף (' + f1(prev) + ' ואז ' + f1(st.lastScore) + ')'); level += 3;
        st.lowTwice = [prev, st.lastScore];
      }
    }
    if (last.fb !== 'כן' && st.age !== null && st.age > cfg.feedbackDays) {
      reasons.push('לא הועבר משוב כבר ' + st.age + ' ימים מאז התצפית'); level += 1;
    }
    if (st.semN < cfg.target) { reasons.push('בוצעו ' + st.semN + ' מתוך ' + cfg.target + ' תצפיות ב' + X.sem); level += 1; }
    if (st.age !== null && st.age > cfg.staleDays) { reasons.push('עברו ' + st.age + ' ימים מהתצפית האחרונה'); level += 1; }
  }
  st.risk = reasons.length ? {
    level: level, reasons: reasons,
    label: level >= 5 ? 'קריטי' : (level >= 3 ? 'גבוה' : 'למעקב'),
    cls: level >= 5 ? 'red' : (level >= 3 ? 'orange' : 'yellow')
  } : null;

  /* המלצה — כמו "המלצות למנה"ד" */
  var gap = cfg.target - st.semN, pri = 0, why = '';
  if (!last) { pri = 1; why = 'מעולם לא נצפתה — אין עליה שום מידע. זו התצפית שתיתן הכי הרבה ערך.'; }
  else if (gap > 0 && st.lastScore !== null && st.lastScore < cfg.low) {
    pri = 2; why = 'הציון האחרון ' + f1(st.lastScore) + ' מתחת לסף, וחסרות ' + gap + ' תצפיות להשלמת היעד. צריכה ליווי צמוד.';
  } else if (gap > 0) { pri = 3; why = 'חסרות ' + gap + ' תצפיות מתוך ' + cfg.target + ' ב' + X.sem + '.'; }
  else if (st.age !== null && st.age > cfg.staleDays) { pri = 4; why = 'עמדה ביעד, אבל עברו ' + st.age + ' ימים מהתצפית האחרונה. רענון.'; }
  st.reco = pri ? { pri: pri, why: why, gap: Math.max(gap, 0), label: ['דחוף', 'גבוה', 'רגיל', 'רענון'][pri - 1], cls: ['red', 'orange', 'plain', 'blue'][pri - 1] } : null;

  st.status = !last ? 'never' : (st.risk && st.risk.level >= 3 ? 'risk' : (st.semN < cfg.target ? 'below' : 'ok'));
  return st;
}
function person(name) {
  return X.people[name] || { n: name, rows: [], ra: [], mn: [], mf: [], pl: [], mz: [], mc: '', pid: '', x: '', unknown: true };
}
function statusChip(st) {

  if (st.status === 'risk') return '<span class="chip ' + st.risk.cls + '">סיכון ' + esc(st.risk.label) + '</span>';
  if (st.status === 'below') return '<span class="chip plain">מתחת ליעד</span>';

/* ---------- חישוב ראשי ---------- */
function recompute() {
  X = { valid: [], broken: [], byRow: {}, byMash: {}, people: {}, ms: {} };
  D.obs.forEach(function (o) {
    X.byRow[o.r] = o;
    if (o.m && o.d) { o.t = toD(o.d).getTime(); o.age = daysAgo(o.d); X.valid.push(o); }
    else X.broken.push(o);
  });
  X.valid.sort(function (a, b) { return (b.t - a.t) || (b.r - a.r); });
  for (var i = X.valid.length - 1; i >= 0; i--) {
    var o = X.valid[i];
    (X.byMash[o.m] || (X.byMash[o.m] = [])).push(o);
  }
  X.sem = curSem();

  D.roster.forEach(function (r) {
    if (r.sus) return;
    var p = X.people[r.n] || (X.people[r.n] = { n: r.n, rows: [], ra: [], mn: [], mf: [], pl: [], mz: [], mc: '', pid: '', x: '' });
    p.rows.push(r);
    [['ra', r.ra], ['mn', r.mn], ['mf', r.mf], ['pl', r.pl], ['mz', r.mz]].forEach(function (x) {
      if (x[1] && p[x[0]].indexOf(x[1]) === -1) p[x[0]].push(x[1]);
    });
    if (r.mc) p.mc = r.mc;
    if (r.pid) p.pid = r.pid;
    if (r.x) p.x = r.x;
  });

  var names;
  if (D.user.seesAll) names = Object.keys(X.people);
  else if (D.mine && D.mine.length) names = D.mine.filter(function (n) { return X.people[n]; });
  else names = [];
  X.scoped = !D.user.seesAll;
  X.universe = heSort(names);
  X.inUni = {}; X.universe.forEach(function (n) { X.inUni[n] = 1; });

  uniq(X.universe.concat(Object.keys(X.byMash))).forEach(function (n) { X.ms[n] = mashStats(n); });
  X.nat = agg(X.valid);
  X.seenUni = X.universe.filter(function (n) { return X.ms[n].total > 0; }).length;

  X.alerts = buildAlerts();
  X.reco = buildReco();
  X.risk = Object.keys(X.byMash).map(function (n) { return X.ms[n]; })
    .filter(function (s) { return s.risk; })
    .sort(function (a, b) { return (b.risk.level - a.risk.level) || ((a.lastScore === null ? 999 : a.lastScore) - (b.lastScore === null ? 999 : b.lastScore)); });
  // רק טיוטות מהחודש האחרון; תצפיות ישנות שלא סומנו אינן "טיוטה שמחכה"
  X.drafts = D.obs.filter(function (o) { return !o.dn && o.e && isMine(o) && (!o.d || daysAgo(o.d) <= 30); });
  X.quality = null;
}

/* ---------- התראות ---------- */
function buildAlerts() {
  var cfg = D.cfg, out = [];
  Object.keys(X.byMash).forEach(function (n) {
    var st = X.ms[n];
    if (st.lowTwice) {
      out.push({ sev: 1, kind: 'low2', title: 'ציון נמוך פעמיים ברצף', m: n, o: st.last,
        info: f1(st.lowTwice[0]) + ' ואז ' + f1(st.lowTwice[1]), todo: 'לתאם שיחת משוב ותצפית מלווה' });
    }
  });
  X.valid.forEach(function (o) {

    out.push({ sev: o.age > 21 ? 1 : 2, kind: 'fb', title: 'משוב לא הועבר ' + o.age + ' ימים', m: o.m, o: o,
      info: o.ob ? 'מתצפת: ' + o.ob : '', todo: 'להעביר משוב ולסמן' });
  });
  out.sort(function (a, b) { return (a.sev - b.sev) || (a.o.t - b.o.t); });
  return out;
}

/* ---------- המלצות ---------- */
function buildReco() {
  var out = [];
  X.universe.forEach(function (n) {
    var st = X.ms[n];
    if (st.reco) out.push(st);
  });
  out.sort(function (a, b) {
    if (a.reco.pri !== b.reco.pri) return a.reco.pri - b.reco.pri;
    var x = a.lastScore, y = b.lastScore;
    if (x === null && y === null) return a.n.localeCompare(b.n, 'he');
    if (x === null) return -1; if (y === null) return 1;
    return x - y;
  });
  return out;
}

/* ---------- פילוח ---------- */
function pivot(list, keyFn) {
  var box = {}, order = [];
  list.forEach(function (o) {
    var k = keyFn(o);
    if (!k) return;
    var id = (typeof k === 'object') ? k.id : k;
    if (!box[id]) { box[id] = { key: k, list: [] }; order.push(id); }
    box[id].list.push(o);
  });
  return order.map(function (id) {
    var a = agg(box[id].list), k = box[id].key;
    return { id: id, key: (typeof k === 'object') ? k.t : k, sub: (typeof k === 'object') ? k.s : '',
      n: a.n, share: list.length ? a.n / list.length : 0, mash: a.mash, avg: a.avg === null ? null : r1(a.avg),
      low: a.low, ca: a.ca, last: a.last, fbp: a.n ? a.fb / a.n : 0 };
  });
}

/* ---------- אחריות ---------- */
function responsibility(field) {
  var own = {};
  D.roster.forEach(function (r) {
    if (r.sus) return;
    var who = r[field];
    if (!who || /^\d{5,}$/.test(who)) return;
    if (!X.scoped || X.inUni[r.n]) {
      var o = own[who] || (own[who] = { mash: {}, rash: {} });
      o.mash[r.n] = 1;
      if (r.ra) o.rash[r.ra] = 1;
    }
  });
  var byRash = {};
  X.valid.forEach(function (o) {
    if (!o.ra || o.s === null) return;
    var b = byRash[o.ra] || (byRash[o.ra] = { sum: 0, cnt: 0 });
    b.sum += o.s; b.cnt++;
  });
  return Object.keys(own).map(function (who) {
    var mine = Object.keys(own[who].mash), rash = Object.keys(own[who].rash);
    var all = [], seen = 0;
    mine.forEach(function (m) { var l = X.byMash[m]; if (l && l.length) { seen++; all = all.concat(l); } });
    var a = agg(all), rs = 0, rc = 0;
    rash.forEach(function (r) { if (byRash[r]) { rs += byRash[r].sum; rc += byRash[r].cnt; } });
    return { who: who, total: mine.length, seen: seen, none: mine.length - seen,
      cov: mine.length ? seen / mine.length : 0, rash: heSort(rash), n: a.n,
      avg: a.avg === null ? null : r1(a.avg), ravg: rc ? r1(rs / rc) : null, ca: a.ca, last: a.last, names: mine };
  });
}

/* ---------- מתצפתים ---------- */
function observers(role) {
  var cfg = D.cfg, by = {}, curWeek = Math.max(schoolWeek(D.today), 1);
  X.valid.forEach(function (o) {
    if (!o.ob) return;
    if (role && o.ro !== role) return;
    var a = by[o.ob] || (by[o.ob] = { who: o.ob, role: '', list: [], w: {}, same: {} });
    a.list.push(o);
    if (o.ro) a.role = o.ro;
    var wn = schoolWeek(o.d);
    if (wn > 0) a.w[wn] = (a.w[wn] || 0) + 1;
    (o.c || []).forEach(function (v) { if (typeof v === 'number') a.same[v] = (a.same[v] || 0) + 1; });
  });
  var g = X.nat.avg;
  return Object.keys(by).map(function (k) {
    var a = by[k], ag = agg(a.list);

    if (F.ra && o.ra !== F.ra) return false;

    if (F.sh && o.sh !== F.sh) return false;
    if (F.ob && o.ob !== F.ob) return false;
    if (F.st === 'draft' && o.dn) return false;
    if (F.st === 'low' && !(o.s !== null && o.s < cfg.low)) return false;
    if (F.st === 'nofb' && (o.fb === 'כן')) return false;

function formSend(finish, force) {
  FORM.saving = true;
  $$('.savebar .btn').forEach(function (b) { b.disabled = true; });
  var payload = { row: FORM.row, fp: FORM.fp, finish: finish, force: force, f: FORM.f };
  call('apiSave', payload).then(function (res) {
    if (res && res.dup) {

    }

    var at = -1;
    D.obs.forEach(function (x, i) { if (x.r === o.r) at = i; });
    if (at >= 0) D.obs[at] = o; else D.obs.push(o);
    if (FORM.f.observer && !D.user.name) lsSet('my_name', FORM.f.observer);
    if (FORM.f.role) lsSet('my_role', FORM.f.role);
    lsDel(DRAFT_KEY);
    FORM.saved = true;
    recompute();
    go('obs', { r: o.r });
    toast(o.dn ? (res.isNew || !payload.row ? 'התצפית נשמרה והסתיימה' : 'השינויים נשמרו') : 'הטיוטה נשמרה');

  var cfg = D.cfg, h = '';
  h += '<div class="sheet"><div class="hd"><h2>פעולות</h2></div><div class="bd"><div class="list" style="margin:0 -16px">' +
    sysRow('סנכרון קובץ השיוך', 'מושך מחדש את המש"קיות, המפקדות והמנה"דים מקובץ "כא גשרים". להריץ אחרי כל שינוי בקובץ.', 'sysSync', 'סנכרן עכשיו') +
    sysRow('רענון הנתונים', 'האתר שומר את הנתונים כמה דקות כדי לעבוד מהר. אם ערכת משהו ישירות בגיליון ואינך רואה אותו — רענן.', 'refresh', 'רענן') +
    sysRow('מצגת חודשית', 'יוצר מצגת Google Slides מהגרפים שבגיליון "דשבורד", ושומר אותה לצד הקובץ.', 'sysPres', 'הפק מצגת') +
    (cfg.sheetUrl ? '<div class="li"><span class="t">הגיליון</span><span class="e"><a class="btn sm" href="' + esc(cfg.sheetUrl) + '" target="_blank" rel="noopener">' + ic('ext') + 'פתח</a></span><span class="m">מקום האחסון של כל הנתונים. לעבודה שוטפת אין צורך לפתוח אותו.</span></div>' : '') +
    '</div></div></div>';
  h += '<div class="cols c2"><div class="sheet"><div class="hd"><h2>כללי החישוב</h2><span class="note">מוגדרים בקוד הגיליון, תחת CFG</span></div><div class="bd"><dl class="kv">' +
    [['ציון נמוך', 'מתחת ל-' + cfg.low], ['יעד למש"קית', cfg.target + ' תצפיות בסמסטר'], ['יעד למנה"ד ולמפקדת', cfg.weeklyTarget + ' תצפיות בשבוע'],
     ['משוב באיחור', 'אחרי ' + cfg.feedbackDays + ' ימים'], ['לא נצפתה זמן רב', 'אחרי ' + cfg.staleDays + ' ימים'], ['ירידה שמדליקה סיכון', cfg.riskDrop + ' נקודות ומעלה'],
     ['סמסטר נוכחי', X.sem]].map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>'; }).join('') + '</dl></div></div>' +
    '<div class="sheet"><div class="hd"><h2>מצב המערכת</h2></div><div class="bd"><dl class="kv">' +
    [['גרסת האתר', cfg.version], ['תצפיות', D.obs.length], ['מש"קיות בשיוך', Object.keys(X.people).length], ['רשויות', (D.rashuyot || []).length],
     ['שיפטים', (D.lists.shifts || []).length], ['מחובר כ', D.user.email]].map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>'; }).join('') + '</dl></div></div></div>';
  return h;
};
function sysRow(title, text, act, label) {
  return '<div class="li"><span class="t">' + esc(title) + '</span><span class="e"><button type="button" class="btn sm" data-act="' + act + '">' + esc(label) + '</button></span><span class="m">' + esc(text) + '</span></div>';
}
ACT.sysSync = function (el) {
  el.disabled = true; el.textContent = 'מסנכרן…';
  call('apiSyncRoster').then(function (r) {
    toast('הסנכרון הושלם: ' + r.mashakiot + ' מש"קיות' + (r.incomplete ? ', ' + r.incomplete + ' עם פרטים חסרים' : ''));
    return reloadData(true);
  }).catch(function (e) { el.disabled = false; el.textContent = 'סנכרן עכשיו'; fail(e); });
};
ACT.sysPres = function (el) {
  el.disabled = true; el.textContent = 'מפיק…';
  call('apiPresentation').then(function (r) {
    el.disabled = false; el.textContent = 'הפק מצגת';
    openDlg({ title: 'המצגת נוצרה', html: '<div class="db"><p>המצגת נשמרה לצד הגיליון בדרייב.</p></div><div class="df"><a class="btn pri" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + ic('ext') + 'פתח את המצגת</a><button type="button" class="btn" data-act="dlgClose">סגור</button></div>' });
  }).catch(function (e) { el.disabled = false; el.textContent = 'הפק מצגת'; fail(e); });
};

/* ==========================================================================
   הפעלה
   ========================================================================== */
var _loadedAt = 0;
var NAV = [
  ['home', 'בית', 'home'], ['list', 'תצפיות', 'list'], ['mash', 'מש"קיות', 'people'],
  ['rep', 'דוחות', 'chart'], ['care', 'טיפול', 'care'], ['adm', 'ניהול', 'gear']
];
function navItems() { return NAV.filter(function (n) { return n[0] !== 'adm' || D.user.isAdmin; }); }

function buildChrome() {
  var u = D.user, who = u.name || u.email.split('@')[0];
  var rail = '<div class="brand">' + esc(D.cfg.title) + '</div><div class="sub">תוכנית גשרים</div><nav aria-label="ניווט ראשי">';
  if (u.canWrite) rail += '<button type="button" class="new" data-act="newObs">' + ic('plus') + 'תצפית חדשה</button>';
  navItems().forEach(function (n) {
    if (n[0] === 'adm') rail += '<div class="gap"></div>';
    rail += '<button type="button" data-nav="' + n[0] + '" data-act="go" data-v="' + n[0] + '">' + ic(n[2]) + '<span>' + esc(n[1]) + '</span>' + (n[0] === 'care' ? '<span class="n" id="railN" hidden></span>' : '') + '</button>';
  });
  rail += '</nav><div class="me"><b title="' + esc(u.email) + '">' + esc(who) + '</b>' + esc(u.role) + (u.role === 'מנה"ד מחוזי' && u.scope ? ', ' + esc(u.scope) : '') +
    '<br><button type="button" data-act="refresh">רענן נתונים</button></div>';
  $('#rail').innerHTML = rail;

  $('#topbar').innerHTML = '<div class="brand">' + esc(D.cfg.title) + '</div><div class="me"><b>' + esc(who) + '</b>' + esc(u.role) + '</div>';

  var tb = '<button type="button" data-nav="home" data-act="go" data-v="home">' + ic('home') + 'בית</button>' +
    '<button type="button" data-nav="list" data-act="go" data-v="list">' + ic('list') + 'תצפיות</button>';
  if (u.canWrite) tb += '<button type="button" class="plus" data-nav="form" data-act="newObs" aria-label="תצפית חדשה"><span class="c">' + ic('plus') + '</span></button>';
  tb += '<button type="button" data-nav="mash" data-act="go" data-v="mash">' + ic('people') + 'מש"קיות</button>' +
    '<button type="button" data-nav="more" data-act="moreMenu">' + ic('more') + 'עוד<span class="dot" id="tabN" hidden></span></button>';
  $('#tabbar').innerHTML = tb;
}
function afterRender() {
  if (!X) return;
  var crit = X.alerts.filter(function (a) { return a.sev === 1; }).length;
  ['#railN', '#tabN'].forEach(function (id) {
    var el = $(id); if (!el) return;
    el.hidden = !crit; el.textContent = crit || '';
  });
  var more = $('[data-nav=more]');
  if (more) more.classList.toggle('on', ['rep', 'care', 'adm'].indexOf(ST.view) !== -1);
}
ACT.moreMenu = function () {
  var crit = X.alerts.filter(function (a) { return a.sev === 1; }).length;
  var rows = [['rep', 'דוחות', 'תמונת מצב, פילוחים, אחריות, מתצפתים'], ['care', 'טיפול', crit ? crit + ' התראות קריטיות' : 'התראות, המלצות, בקרת נתונים']];
  if (D.user.isAdmin) rows.push(['adm', 'ניהול', 'משתמשים, סנכרון שיוך, מצגת']);
  openDlg({
    title: 'עוד',
    html: '<div class="opts">' + rows.map(function (r) { return '<button type="button" class="opt" data-act="go" data-v="' + r[0] + '"><b>' + esc(r[1]) + '</b><span>' + esc(r[2]) + '</span></button>'; }).join('') +
      '<button type="button" class="opt" data-act="refresh"><b>רענן נתונים</b><span>טוען מחדש מהגיליון</span></button></div>' +
      '<div class="df"><span class="sub">' + esc(D.user.email) + ' · ' + esc(D.user.role) + ' · גרסה ' + esc(D.cfg.version) + '</span></div>'
  });
};

function showGate(html) {
  $('#app').hidden = true;
  var g = $('#gate'); g.hidden = false;
  $('#gateMsg').innerHTML = html;
}
function gateFor(res) {
  if (res && res.why === 'noid') return 'לא זוהה חשבון Google.<br>היכנס עם החשבון הארגוני שלך ורענן את הדף.';
  if (res && res.why === 'domain') return 'לחשבון <span dir="ltr">' + esc(res.email) + '</span> אין הרשאה לאתר.<br>היכנס עם החשבון הארגוני, או פנה למנהל המערכת.';
  return 'האתר לא נטען. נסה לרענן את הדף.';
}
function applyData(res) {
  D = res; DETAIL = {}; ST.log = null; ST.users = null;
  recompute();
  _loadedAt = Date.now();
}
function reloadData(force) {
  return call(force ? 'apiRefresh' : 'apiInit').then(function (res) {
    if (!res || !res.ok) { showGate(gateFor(res)); return; }
    applyData(res); buildChrome(); render();
  });
}
ACT.refresh = function () {
  if (_dlg) closeDlg(null);
  if (ST.view === 'form' && FORM && FORM.dirty) { toast('שמור קודם את התצפית שבמילוי, ואז רענן.', 'err'); return; }
  reloadData(true).then(function () { toast('הנתונים עודכנו'); }).catch(fail);
};
ACT.retry = function () { start(); };

function start() {
  showGate('מתחבר…');
  call('apiInit').then(function (res) {
    if (!res || !res.ok) { showGate(gateFor(res)); return; }
    applyData(res);
    buildChrome();
    $('#gate').hidden = true;
    $('#app').hidden = false;
    render();
    try {
      google.script.history.setChangeHandler(function (e) {
        var s = e && e.state;
        if (_dlg) closeDlg(null);
        if (s && s.v) go(s.v, s.p || {}, { silent: true });
        else go('home', {}, { silent: true });
      });
    } catch (err) {}
  }).catch(function (e) {
    showGate(esc(cleanErr(e)) + '<br><br><button type="button" class="btn pri" data-act="retry">נסה שוב</button>');
  });
}

/* חזרה ללשונית אחרי זמן: טוענים מחדש בשקט, אבל לא באמצע מילוי טופס */
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !D || _dlg || ST.view === 'form') return;
  if (Date.now() - _loadedAt < 4 * 60000) return;
  _loadedAt = Date.now();
  call('apiInit').then(function (res) {
    if (res && res.ok && res.stamp !== D.stamp && ST.view !== 'form' && !_dlg) { applyData(res); render(); }
  }).catch(function () {});
});
var _wide = null, _rsT = null;
window.addEventListener('resize', function () {
  clearTimeout(_rsT);
  _rsT = setTimeout(function () {
    var w = isWide();
    if (_wide !== null && w !== _wide && D && ST.view !== 'form' && !_dlg) render();
    _wide = w;
  }, 150);
});
_wide = isWide();
start();

</script>
</body>
</html>
